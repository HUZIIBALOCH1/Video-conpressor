<!DOCTYPE html>
<html>
<head>
    <title>Video Compressor</title>
    <style>
        body { font-family: Arial; background: #0f0f1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #1e1e2f; padding: 40px; border-radius: 20px; text-align: center; width: 400px; }
        input { margin: 20px 0; padding: 10px; }
        button { background: #4a6cf7; color: white; border: none; padding: 12px 30px; border-radius: 30px; cursor: pointer; }
        #status { margin-top: 20px; font-size: 18px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4a6cf7; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 10px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="box">
    <h2>📹 Upload & Compress</h2>
    <input type="file" id="fileInput" accept="video/*">
    <button onclick="uploadVideo()">Compress Now</button>
    <div class="loader" id="loader"></div>
    <div id="status"></div>
</div>
<script>
async function uploadVideo() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return alert('Please select a video');
    const formData = new FormData();
    formData.append('file', file);
    document.getElementById('loader').style.display = 'block';
    document.getElementById('status').innerHTML = 'Compressing... (wait few seconds)';
    
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();
    document.getElementById('loader').style.display = 'none';
    
    if (data.download_url) {
        document.getElementById('status').innerHTML = '✅ Done! Downloading...';
        window.location.href = data.download_url;
    } else {
        document.getElementById('status').innerHTML = '❌ Error: ' + data.error;
    }
}
</script>
</body>
</html>
